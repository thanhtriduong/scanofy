<text x="520.0" y="767.48" font-family="Arial, sans-serif" font-size="18" fill="#494949" text-anchor="middle">mineru-kit parse · Output riêng từng lần chạy</text>
<path d="M520,640 L520,695" stroke="#606060" stroke-width="3"/><polygon points="520,695 513,683 527,683" fill="#606060"/>
