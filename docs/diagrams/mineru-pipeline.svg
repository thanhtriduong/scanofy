<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1710" viewBox="0 0 1680 1710"><rect width="100%" height="100%" fill="white"/>
<text x="80" y="89.4" font-family="Arial, sans-serif" font-size="40" fill="#201f20" text-anchor="start">SCANOFY · LUỒNG XỬ LÝ TÀI LIỆU MINERU</text>
<text x="80" y="134.78" font-family="Arial, sans-serif" font-size="23" fill="#494949" text-anchor="start">Xử lý nền song song với đọc PDF · Sơ đồ theo mã nguồn triển khai</text>
<text x="520" y="199.94" font-family="Arial, sans-serif" font-size="29" fill="#201f20" text-anchor="middle">BACKEND VÀ DỮ LIỆU</text>
<text x="1350" y="199.94" font-family="Arial, sans-serif" font-size="29" fill="#201f20" text-anchor="middle">TRẢI NGHIỆM NGƯỜI DÙNG</text>
