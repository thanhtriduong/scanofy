<rect x="80" y="540" width="880" height="100" rx="12" fill="#f7f6f6" stroke="#c8c7c7" stroke-width="2"/>
<text x="520.0" y="578.78" font-family="Arial, sans-serif" font-size="23" fill="#201f20" text-anchor="middle">3. Router</text>
<text x="520.0" y="612.48" font-family="Arial, sans-serif" font-size="18" fill="#494949" text-anchor="middle">Chọn MinerU cho PDF số / hỗn hợp và DOCX</text>
<path d="M520,485 L520,540" stroke="#606060" stroke-width="3"/><polygon points="520,540 513,528 527,528" fill="#606060"/>
