<text x="1350.0" y="457.48" font-family="Arial, sans-serif" font-size="18" fill="#494949" text-anchor="middle">Cuộn trang · Zoom · Thumbnail</text>
<path d="M1350,330 L1350,385" stroke="#606060" stroke-width="3"/><polygon points="1350,385 1343,373 1357,373" fill="#606060"/>
<rect x="1100" y="540" width="500" height="100" rx="12" fill="#f7f6f6" stroke="#c8c7c7" stroke-width="2"/>
<text x="1350.0" y="578.78" font-family="Arial, sans-serif" font-size="23" fill="#201f20" text-anchor="middle">Nhánh OCR khác</text>
<text x="1350.0" y="612.48" font-family="Arial, sans-serif" font-size="18" fill="#494949" text-anchor="middle">awaiting_ocr · Adapter chưa tích hợp</text>
<path d="M960,590 L1100,590" stroke="#606060" stroke-width="3"/><polygon points="1100,590 1088,583 1088,597" fill="#606060"/>
