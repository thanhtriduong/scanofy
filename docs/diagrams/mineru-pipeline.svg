<text x="1350.0" y="1077.48" font-family="Arial, sans-serif" font-size="18" fill="#494949" text-anchor="middle">Vẫn đọc file gốc · Thử lại tạo job mới</text>
<path d="M1350,950 L1350,1005" stroke="#606060" stroke-width="3"/><polygon points="1350,1005 1343,993 1357,993" fill="#606060"/>
<rect x="1100" y="1315" width="500" height="100" rx="12" fill="#eef2ff" stroke="#2e5bff" stroke-width="2"/>
<text x="1350.0" y="1353.78" font-family="Arial, sans-serif" font-size="23" fill="#201f20" text-anchor="middle">Mở cấu trúc tài liệu</text>
<text x="1350.0" y="1387.48" font-family="Arial, sans-serif" font-size="18" fill="#494949" text-anchor="middle">Mục lục · Overlay block · Nội dung nguồn</text>
<path d="M960,1365 L1100,1365" stroke="#2e5bff" stroke-width="3"/><polygon points="1100,1365 1088,1358 1088,1372" fill="#2e5bff"/>
<text x="80" y="1498.06" font-family="Arial, sans-serif" font-size="21" fill="#201f20" text-anchor="start">Nhánh lỗi áp dụng cho profiler, CLI, artifact, normalize và lưu database.</text>
<text x="80" y="1543.06" font-family="Arial, sans-serif" font-size="21" fill="#201f20" text-anchor="start">Retry chạy lại từ File Profiler. Renormalize dùng raw đã lưu, mặc định dry-run và không gọi model.</text>
<text x="80" y="1588.06" font-family="Arial, sans-serif" font-size="21" fill="#201f20" text-anchor="start">PaddleOCR / Chandra / Vintern là nhánh dự kiến; sơ đồ không khẳng định đã có adapter hoạt động.</text>
<text x="80" y="1645.48" font-family="Arial, sans-serif" font-size="18" fill="#606060" text-anchor="start">Nguồn: backend Scanofy · Hình mô tả kiến trúc, không phải số liệu benchmark OCR.</text>
