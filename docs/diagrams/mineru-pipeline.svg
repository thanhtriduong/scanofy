<text x="520.0" y="423.78" font-family="Arial, sans-serif" font-size="23" fill="#201f20" text-anchor="middle">2. File Profiler</text>
<text x="520.0" y="457.48" font-family="Arial, sans-serif" font-size="18" fill="#494949" text-anchor="middle">Đo trang, text, ảnh, kích thước và rotation</text>
