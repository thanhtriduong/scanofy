<text x="520.0" y="922.48" font-family="Arial, sans-serif" font-size="18" fill="#494949" text-anchor="middle">middle_json.json + markdown.md · Manifest, hash và raw output</text>
<path d="M520,795 L520,850" stroke="#606060" stroke-width="3"/><polygon points="520,850 513,838 527,838" fill="#606060"/>
